<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>儿童学习 App（P1 Demo）</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f3f7ff; color: #1c2a44; }
      .container { max-width: 900px; margin: 0 auto; padding: 16px; }
      .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
      .btn { border: 0; background: #3d7bff; color: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
      .btn.secondary { background: #6b7a99; }
      .tag { display: inline-block; background: #e8f0ff; color: #1f4fb7; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .question { border: 1px solid #e1e8ff; border-radius: 8px; padding: 8px; margin: 8px 0; }
      .option { display:block; margin:4px 0; cursor: pointer; }
      .muted { color:#6a7695; font-size: 13px; }
      pre { background: #0e1b35; color:#d7e3ff; padding: 8px; border-radius: 8px; overflow-x: auto; max-height: 220px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>儿童学习 App（可运行演示）</h2>
      <div class="card">
        <span class="tag">学习进度</span>
        <p>连续学习天数：<b id="streak-days">0</b> 天</p>
        <p>今日错题数：<b id="wrong-count">0</b></p>
        <div class="row">
          <button class="btn" id="btn-start-lesson">开始学习（模拟微课）</button>
          <button class="btn secondary" id="btn-open-wrongbook">打开错题本</button>
          <button class="btn secondary" id="btn-claim-reward">领取7天奖励</button>
          <button class="btn secondary" id="btn-reset">重置演示数据</button>
        </div>
      </div>

      <div class="card" id="lesson-panel">
        <h3>学习区</h3>
        <p id="lesson-status" class="muted">点击“开始学习”进入课程。</p>
        <div id="quiz-panel"></div>
      </div>

      <div class="card" id="wrongbook-panel" style="display:none;">
        <h3>错题本</h3>
        <div id="wrongbook-list"></div>
      </div>

      <div class="card">
        <h3>埋点日志（实时）</h3>
        <pre id="events-log"></pre>
      </div>
    </div>

    <script>
      const storeKey = "kid-learning-demo-v1";
      const events = [];

      const state = loadState();

      const quizQuestions = [
        { id: "q1", stem: "apple 的中文是？", options: ["香蕉", "苹果", "葡萄"], answer: 1, explanation: "apple=苹果" },
        { id: "q2", stem: "dog 的中文是？", options: ["小狗", "小猫", "小鸟"], answer: 0, explanation: "dog=小狗" },
        { id: "q3", stem: "blue 的中文是？", options: ["红色", "绿色", "蓝色"], answer: 2, explanation: "blue=蓝色" }
      ];

      function loadState() {
        const raw = localStorage.getItem(storeKey);
        if (!raw) return { streakDays: 0, rewardClaimed: false, wrongbook: [], lastStudyDate: null };
        return JSON.parse(raw);
      }
      function saveState() { localStorage.setItem(storeKey, JSON.stringify(state)); }

      function track(event, payload = {}) {
        const item = { ts: new Date().toISOString(), event, ...payload };
        events.push(item);
        renderEvents();
      }

      function renderEvents() {
        document.getElementById("events-log").textContent = events.slice(-20).map(e => JSON.stringify(e)).join("\n");
      }

      function updateSummary() {
        document.getElementById("streak-days").textContent = state.streakDays;
        document.getElementById("wrong-count").textContent = state.wrongbook.length;
      }

      function startLesson() {
        const now = new Date().toISOString().slice(0, 10);
        if (state.lastStudyDate !== now) {
          state.streakDays += 1;
          state.lastStudyDate = now;
          state.rewardClaimed = false;
        }
        saveState();
        updateSummary();
        track("lesson_start", { lesson_id: "lesson_101" });
        document.getElementById("lesson-status").textContent = "课程完成，开始即时测（3题）";
        renderQuiz();
      }

      function renderQuiz() {
        track("quiz_start", { quiz_id: "quiz_001" });
        const panel = document.getElementById("quiz-panel");
        panel.innerHTML = "";
        quizQuestions.forEach((q, idx) => {
          const div = document.createElement("div");
          div.className = "question";
          div.innerHTML = `<b>${idx + 1}. ${q.stem}</b>`;
          q.options.forEach((opt, i) => {
            const label = document.createElement("label");
            label.className = "option";
            label.innerHTML = `<input type="radio" name="${q.id}" value="${i}" /> ${opt}`;
            div.appendChild(label);
          });
          panel.appendChild(div);
        });

        const submit = document.createElement("button");
        submit.className = "btn";
        submit.textContent = "提交测验";
        submit.onclick = submitQuiz;
        panel.appendChild(submit);
      }

      function submitQuiz() {
        let correct = 0;
        const wrongItems = [];
        quizQuestions.forEach(q => {
          const selected = document.querySelector(`input[name="${q.id}"]:checked`);
          const idx = selected ? Number(selected.value) : -1;
          const isCorrect = idx === q.answer;
          track("quiz_submit", { question_id: q.id, is_correct: isCorrect });
          if (isCorrect) correct += 1;
          else wrongItems.push({ question_id: q.id, stem: q.stem, explanation: q.explanation });
        });
        state.wrongbook = wrongItems;
        saveState();
        updateSummary();
        track("quiz_complete", { score: correct, total: quizQuestions.length });
        document.getElementById("lesson-status").textContent = `测验完成：${correct}/${quizQuestions.length}`;
        alert(`测验完成：${correct}/${quizQuestions.length}`);
      }

      function openWrongbook() {
        track("wrongbook_entry_click", { wrong_count: state.wrongbook.length });
        const panel = document.getElementById("wrongbook-panel");
        const list = document.getElementById("wrongbook-list");
        panel.style.display = "block";
        if (!state.wrongbook.length) {
          list.innerHTML = "<p class='muted'>今日无错题，继续保持！</p>";
          return;
        }
        list.innerHTML = state.wrongbook.map(i => `<p>• ${i.stem}（${i.explanation}）</p>`).join("");
      }

      function claimReward() {
        if (state.streakDays < 7) {
          alert("未达到 7 天，继续加油！");
          track("streak_progress", { streak_days: state.streakDays });
          return;
        }
        if (state.rewardClaimed) {
          alert("奖励已领取。");
          return;
        }
        state.rewardClaimed = true;
        saveState();
        track("streak_reward_claim", { streak_days: state.streakDays });
        alert("奖励领取成功！");
      }

      function resetDemo() {
        localStorage.removeItem(storeKey);
        location.reload();
      }

      document.getElementById("btn-start-lesson").onclick = startLesson;
      document.getElementById("btn-open-wrongbook").onclick = openWrongbook;
      document.getElementById("btn-claim-reward").onclick = claimReward;
      document.getElementById("btn-reset").onclick = resetDemo;

      updateSummary();
      renderEvents();
    </script>
  </body>
 </html>
